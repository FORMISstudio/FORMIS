<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>FORMIS — website design &amp; development</title>
  <meta name="description" content="FORMIS builds websites for people and businesses: bio sites, landing pages and custom projects. Design, development and launch.">
  <link rel="canonical" href="https://formis.space/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="FORMIS — design &amp; webdev">
  <meta property="og:description" content="We design and build websites for people and businesses.">
  <meta property="og:url" content="https://formis.space">
  <meta property="og:image" content="https://formis.space/logobig.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "FORMIS",
      "url": "https://formis.space/",
      "logo": "https://formis.space/logo.png",
      "email": "formisworkk@gmail.com",
      "description": "Design and web development studio. We build websites for people and businesses.",
      "serviceType": "Web design and development"
    }
    </script>
</head>
<body>
  <h1 class="visually-hidden">FORMIS — website design and development</h1>
  <header class="header">
    <a class="header__logo" href="index.html" aria-label="FORMIS home">
      <img src="logo.png" alt="FORMIS design &amp; webdev" href="/">
    </a>
    <nav class="nav" aria-label="Main">
      <button class="nav__item" type="button" data-target="order">Order a website</button>
      <button class="nav__item" type="button" data-target="reviews">Reviews</button>
      <button class="nav__item" type="button" data-target="work">Our work</button>
      <button class="nav__item" type="button" data-target="about">About us</button>
      <button class="nav__item" type="button" data-target="pricing">Pricing</button>
    </nav>
    <button class="nav__cta" type="button" data-target="contact">Contact us</button>
  </header>

  <main class="board">
    <button class="tile tile--reviews" type="button" data-tile="reviews">
      <span class="tile__shape tile__shape--circle"></span>
      <span class="tile__title">Reviews</span>
      <span class="tile__text">What our clients say</span>
    </button>

    <button class="tile tile--order" type="button" data-tile="order">
      <span class="tile__shape tile__shape--square"></span>
      <span class="tile__title">Order a website</span>
      <span class="tile__text">Tell us about your business and get a site built around it.</span>
    </button>

    <button class="tile tile--about" type="button" data-tile="about">
      <span class="tile__shape tile__shape--square"></span>
      <span class="tile__title">About us</span>
      <span class="tile__text">Who builds your website</span>
    </button>

    <button class="tile tile--work" type="button" data-tile="work">
      <span class="tile__shape tile__shape--circle"></span>
      <span class="tile__title">Our work</span>
      <span class="tile__text">Websites we have designed and built</span>
    </button>

    <button class="tile tile--pricing" type="button" data-tile="pricing">
      <span class="tile__shape tile__shape--circle"></span>
      <span class="tile__title">Pricing</span>
      <span class="tile__text">Clear packages, no surprises</span>
    </button>
  </main>

  <div class="actions">
    <button class="pay" type="button" data-tile="pay">
      <span class="pay__info">
        <span class="pay__title">Pay for an order</span>
        <span class="pay__text">Enter your order number</span>
      </span>
      <span class="pay__shape"></span>
    </button>

    <button class="pay" type="button" data-tile="guides">
      <span class="pay__info">
        <span class="pay__title">Instructions</span>
        <span class="pay__text">How to order and pay</span>
      </span>
      <span class="pay__shape pay__shape--square"></span>
    </button>
  </div>


  <footer class="footer">
    <a class="footer__mail" href="mailto:formisworkk@gmail.com">formisworkk@gmail.com</a>
    <button class="assistant-toggle" type="button" aria-label="Open assistant" aria-expanded="false" aria-controls="assistant">
      <i class="fa-solid fa-comments"></i>
    </button>
  </footer>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <div class="modal__head">
      <h2 class="modal__title" id="modal-title"></h2>
      <button class="modal__close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M5 5l14 14M19 5L5 19"/>
        </svg>
      </button>
    </div>
    <div class="modal__body" id="modal-body"></div>
  </dialog>

  <aside class="assistant" id="assistant" aria-label="Assistant">
    <div class="assistant__head">
      <span class="assistant__title">FORMIS assistant</span>
      <button class="assistant__close" type="button" aria-label="Close assistant">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M5 5l14 14M19 5L5 19"/>
        </svg>
      </button>
    </div>
    <div class="assistant__messages" id="assistant-messages" aria-live="polite"></div>
    <form class="assistant__form" id="assistant-form">
      <input class="input assistant__input" type="text" maxlength="500" placeholder="Ask anything about our services" aria-label="Message" autocomplete="off">
      <button class="assistant__send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </form>
  </aside>

  <script src="script.js"></script>

  <!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "c1191f3c69ca427ea9e3832893949fef"}'></script><!-- End Cloudflare Web Analytics -->
</body>
</html>
